name: ci-pipeline

on:
  push:
    branches:
      - main


jobs:

  test:
    runs-on: ubuntu-latest

    steps:

      -name: code checkout
        uses: actions/checkout@v4

      -name: python-setup
        uses: actions/python-setup@v5

        with:
          python-version: "3.12"
      
      -name: Run Tests

        uses: pytest
      